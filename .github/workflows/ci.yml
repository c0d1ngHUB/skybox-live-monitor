name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python test runner
        run: python3 -m pip install pytest
      - name: Validate metadata
        run: python3 -m json.tool metadata.json >/dev/null
      - name: Check JavaScript syntax
        run: node --check contents/code/monitor_logic.js
      - name: Run Python regression tests
        run: python3 -m pytest -q
      - name: Reject unsafe QML layout positioning
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools
          /usr/lib/qt6/bin/qmllint contents/ui/main.qml 2> qmllint.log || true
          ! grep -q '\[Quick.layout-positioning\]' qmllint.log
